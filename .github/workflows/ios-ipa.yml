name: Inspect App Store age rating
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  age-rating:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyJWT cryptography
      - name: Read App Store age rating
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        shell: python
        run: |
          import os,base64,time,json,urllib.request,urllib.error
          import jwt
          key=base64.b64decode(os.environ['ASC_PRIVATE_KEY'])
          now=int(time.time())
          token=jwt.encode({'iss':os.environ['ASC_ISSUER'],'iat':now,'exp':now+600,'aud':'appstoreconnect-v1'},key,algorithm='ES256',headers={'kid':os.environ['ASC_KEY_ID'],'typ':'JWT'})
          print('::add-mask::'+token)
          def apple(path):
              req=urllib.request.Request('https://api.appstoreconnect.apple.com/v1/'+path,headers={'Authorization':'Bearer '+token})
              try:
                  return json.load(urllib.request.urlopen(req,timeout=60))
              except urllib.error.HTTPError as e:
                  print(e.read().decode()); raise SystemExit(1)
          infos=apple('apps/6772871793/appInfos')
          print('APP_INFOS '+json.dumps(infos))
          for info in infos['data']:
              print('AGE_DECLARATION '+info['id']+' '+json.dumps(apple('appInfos/'+info['id']+'/ageRatingDeclaration')))
          print('VERSIONS '+json.dumps(apple('apps/6772871793/appStoreVersions?filter[platform]=IOS&limit=5')))
